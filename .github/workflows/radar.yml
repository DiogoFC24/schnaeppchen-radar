                _EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python main.py run --sofort-senden

      - name: Datenbank für den nächsten Lauf speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/radar.sqlite
          key: radar-db-${{ github.run_id }}

