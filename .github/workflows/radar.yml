name: Schnaeppchen-Radar

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: schnaeppchen-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Libraries installieren
        run: pip install -r requirements.txt

      - name: config.yaml schreiben
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: printf '%s' "$CONFIG_YAML" > config.yaml

      - name: Datenbank wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: data/radar.sqlite
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Radar ausfuehren
        env:
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: "993"
          IMAP_FOLDER: INBOX
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_FROM_NAME: Schnaeppchen-Radar
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python main.py run --sofort-senden

      - name: Datenbank speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/radar.sqlite
          key: radar-db-${{ github.run_id }}
