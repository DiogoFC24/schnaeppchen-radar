name: Schnaeppchen-Radar

on:
  schedule:
    # alle 15 Minuten, bewusst nicht zur vollen Stunde
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Nie zwei Läufe gleichzeitig, sonst überschreiben sie sich die Datenbank
concurrency:
  group: schnaeppchen-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Libraries installieren
        run: pip install -r requirements.txt

      - name: config.yaml aus dem Secret schreiben
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: printf '%s' "$CONFIG_YAML" > config.yaml

      - name: Datenbank vom letzten Lauf wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: data/radar.sqlite
